<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Takip özeti</title>
<style>
:root{--bg:#F7F5FA;--card:#fff;--ink:#2B2240;--sub:#776C80;--pri:#D63C78;--soft:#FFE3F1;--line:#E7E2EE}
@media (prefers-color-scheme:dark){:root{--bg:#17131F;--card:#231D2E;--ink:#F4EEF8;--sub:#B3A8C0;--pri:#FF6FA3;--soft:#3D1E31;--line:#3A3147}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:24px;margin:0}.sub{color:var(--sub);font-size:14px;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
h2{font-size:16px;margin:0 0 6px}
.li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:10px}.bars div{flex:1;background:var(--soft);border-radius:4px;min-height:2px}.bars div:last-child{background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--sub);font-size:12px;border-top:0}
.scroll{overflow-x:auto}.note{color:var(--sub);font-size:13px;margin-top:16px}
</style></head>
<body><main id="m"><h1>Takip özeti</h1><p class="sub">Yükleniyor…</p></main>
<script>
(function(){
  var m=document.getElementById('m');
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fail(t){m.innerHTML='<h1>Takip özeti</h1><div class="card"><p>'+t+'</p></div><p class="note">Annebek</p>'}
  var h=location.hash.slice(1);
  if(!h){fail('Bağlantı eksik görünüyor. Gönderen kişiden yeni bir bağlantı isteyebilirsin.');return}
  var s;
  try{
    var b=atob(h.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((h.length+3)%4));
    var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    s=JSON.parse(new TextDecoder().decode(u));
  }catch(e){fail('Bağlantı okunamadı.');return}
  if(!s||s.v!==1||!Array.isArray(s.d)){fail('Bağlantı okunamadı.');return}
  if(Date.now()>s.x){fail('Bu bağlantının süresi doldu. Gönderen kişiden yeni bir bağlantı isteyebilirsin.');return}
  var d=s.d,n=d.length,p=s.f.split('-').map(Number);
  function day(i){return new Date(p[0],p[1]-1,p[2]+i).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}
  function avg(k){var t=0;for(var i=0;i<n;i++)t+=d[i][k];return t/Math.max(1,n)}
  function n1(v){return (Math.round(v*10)/10).toLocaleString('tr-TR')}
  function hm(v){return Math.floor(v/60)+' sa '+Math.round(v%60)+' dk'}
  var rows=[],cols=[],chart=null;
  if(s.s.f){rows.push(['Emzirme',n1(avg(0))+' kez · toplam '+Math.round(avg(1))+' dk'],['Biberon',n1(avg(2))+' kez · '+Math.round(avg(3))+' ml']);
    cols.push(['Emzirme',function(x){return x[0]+' · '+x[1]+' dk'}],['Biberon',function(x){return x[2]+' · '+x[3]+' ml'}]);chart=chart||['Beslenme sayısı',function(x){return x[0]+x[2]}]}
  if(s.s.b){rows.push(['Islak bez',n1(avg(4))],['Kirli bez',n1(avg(5))]);cols.push(['Bez (ıslak/kirli)',function(x){return x[4]+' / '+x[5]}]);chart=chart||['Islak bez',function(x){return x[4]}]}
  if(s.s.u){rows.push(['Uyku',hm(avg(6))]);cols.push(['Uyku',function(x){return hm(x[6])}]);chart=chart||['Uyku',function(x){return x[6]}]}
  if(s.s.p){rows.push(['Süt sağımı',n1(avg(7))+' kez · '+Math.round(avg(8))+' ml']);cols.push(['Sağım',function(x){return x[7]+' · '+x[8]+' ml'}]);chart=chart||['Sağım (ml)',function(x){return x[8]}]}
  var exp=new Date(s.x).toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
  var html='<h1>'+esc(s.n)+' · takip özeti</h1><p class="sub">'+day(0)+' - '+day(n-1)+' ('+n+' gün) · bağlantı '+exp+' tarihinde kapanır</p>';
  html+='<div class="card"><h2>Günlük ortalama</h2>'+rows.map(function(r){return '<div class="li"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'}).join('')+'</div>';
  if(chart){var last=d.slice(-7),mx=1;last.forEach(function(x){mx=Math.max(mx,chart[1](x))});
    html+='<div class="card"><h2>Son 7 gün · '+chart[0]+'</h2><div class="bars">'+last.map(function(x){return '<div title="'+chart[1](x)+'" style="height:'+Math.round(chart[1](x)/mx*100)+'%"></div>'}).join('')+'</div></div>'}
  var body='';for(var i=n-1;i>=0;i--){body+='<tr><td>'+day(i)+'</td>'+cols.map(function(c){return '<td>'+c[1](d[i])+'</td>'}).join('')+'</tr>'}
  html+='<div class="card"><h2>Gün gün</h2><div class="scroll"><table><tr><th>Gün</th>'+cols.map(function(c){return '<th>'+c[0]+'</th>'}).join('')+'</tr>'+body+'</table></div></div>';
  html+='<p class="note">Bu özet annenin Annebek uygulamasına girdiği kayıtlardan oluşur ve tıbbi değerlendirme içermez. Veriler bu bağlantının içinde taşınır, Annebek sunucularında saklanmaz.</p>';
  m.innerHTML=html;document.title=s.n+' · takip özeti';
})();
</script></body></html>
